[package]
name = "gdep"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
git2 = { version = "0.21", default-features = false, features = ["https"] }
indicatif = "0.17"
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
