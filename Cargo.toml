[package]
name = "gdep"
version = "0.1.0"
edition = "2021"
description = "Godot dependency manager — fetches addons from git repos"
license = "MIT"

[[bin]]
name = "gdep"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
git2 = { version = "0.21", default-features = false, features = ["https"] }
indicatif = "0.18"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
opt-level = 3
